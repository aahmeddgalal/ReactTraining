<!DOCTYPE html>
<html>

<head>
    <title>chat bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .send-button {
            margin-left: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px; 
        }
        input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex-grow: 1;
        }
        .send-button:hover {
            background-color: #45a049;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        } 

        .chat-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            
        }

        .app-container {
            width: 600px;
            margin: 0 auto;
            padding: 20px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .user-message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .robot-message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .message-content {
            background-color: rgba(231, 228, 228, 0.696);
            max-width: 70%;
            word-wrap: break-word;
            padding: 10px;
            border-radius: 10px;
            margin: 0 10px;
            max-width: 70%;
        }

        .message-icon {
            width: 45px;
            height: 45px;
        }

        .chat-messages-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;

        }

        .welcome-message {
        text-align: center;
        color: gray;
        margin-top: 100px;
        }



    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src ="https://unpkg.com/supersimpledev/chatbot.js"></script> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


        function ChatBot({chatMessages, setChatMessages}) { 
            const [inputValue, setInputValue] = React.useState(''); 
            function saveInputText(event) {
                setInputValue(event.target.value);
            }

            function sendMessage() {
                const newChatMessages = [
                    ...chatMessages, // spread operator to include existing messages
                    {
                        message: inputValue,
                        sender: "user",
                        id: "id" + crypto.randomUUID()
                    }
                ];

                setChatMessages(newChatMessages);

                const response = Chatbot.getResponse(inputValue);

                setChatMessages([
                    ...newChatMessages, // spread operator to include existing messages
                    {
                        message: response,
                        sender: "robot",
                        id: "id" + crypto.randomUUID()
                    }
                ]);


                setInputValue(''); // Clear the input field after sending the message
            }

                return (
                    <div className="chat-container">
                        <input
                            type="text"
                            placeholder="Type your message here..." 
                            onChange = {saveInputText} 
                            value={inputValue}
                            />

                        <button
                            onClick = {sendMessage}
                            className="send-button"
                            >Send</button>
                    </div>
                );
            }

            function ChatMessage(props) {
                const sender = props.sender;

                return (
                    <div className = {sender === "user" ? "user-message" : "robot-message"}>
                        {sender === "robot" &&
                            (<img src="robot.png" alt="Icon" width="30" height="30" className="message-icon"/>)}

                        <div className="message-content">
                            {props.message}
                        </div>

                        {sender === "user" &&
                            (<img src="user.png" alt="Icon" width="30" height="30" className="message-icon"/>)}
                    </div>
                );
            }

            function ChatMessages({chatMessages}) {

                const chatMessagesRef = React.useRef(); 
                // the useRef hook is used to create a reference to a DOM element or a value that persists across renders. It returns a mutable ref object whose .current property is initialized to the passed argument (initialValue). The returned object will persist for the full lifetime of the component.



                React.useEffect(() => {
                    const containerElem = chatMessagesRef.current;
                    if (containerElem) {
                        containerElem.scrollTop = containerElem.scrollHeight
                    }
                }, [chatMessages]); // the second parameter of the useEffect hook is an array of dependencies. The effect will only run when one of the dependencies changes. In this case, we want to run the effect every time the chatMessages state changes, so we pass chatMessages as a dependency.
                
                // the useEffect hook is used to perform side effects in function components. It takes a function as an argument and runs that function after every render. The second argument is an array of dependencies, if any of the dependencies change, the effect will run again. In this case, we want to run the effect every time the chatMessages state changes, so we pass chatMessages as a dependency.

                if (chatMessages.length === 0) {
                    return (
                        <div className="welcome-message">
                            Welcome to the chatbot project! Send a message using the textbox below.
                        </div>
                    );
                }


                return (
                    <div 
                    className="chat-messages-container"
                    ref = {chatMessagesRef}
                    >
                        {/* onClick is an event and sendMessage is the event handler */}

                        {chatMessages.map((chatMessage) => {
                            return (
                                <ChatMessage
                                    message={chatMessage.message}
                                    sender={chatMessage.sender}
                                    key={chatMessage.id}
                                />
                            );
                        })}
                    </div>
                );
            }

            function App() {
                const [chatMessages, setChatMessages] = React.useState(
                    []
                );

                //const chatMessages = array[0]; // the first value of the userState array gives us the current value
                //const setChatMessages = array[1]; // the second value of the userState array gives us the function to update the state. in react we should use this function to update the state not updating the state directly because the react won't update the HTML
                //const [chatMessages, setChatMessages] = array; // we can use destructuring assignment to get the values of the userState array in a more convenient way





                return (
                    <div className="app-container">
                        
                        <ChatMessages 
                            chatMessages={chatMessages} 
                        />
                        <ChatBot
                            chatMessages={chatMessages}
                            setChatMessages={setChatMessages} 
                        />

                        {/* Chat messages are generated dynamically */}
                    </div>
                );
            }

            const container = document.querySelector('.js-container');

            ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
